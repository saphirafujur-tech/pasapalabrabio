<!doctype html>
<html lang="es" class="h-full w-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rosco de Pasapalabra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap');

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      font-family: 'Fredoka', sans-serif;
    }

    body {
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 15%, rgba(250,204,21,0.4), transparent 28%),
        radial-gradient(circle at 80% 30%, rgba(37,99,235,0.32), transparent 30%),
        linear-gradient(135deg, #0f766e, #064e3b);
      color: white;
    }

    .app-shell {
      height: 100%;
      width: 100%;
      overflow: auto;
      position: relative;
    }

    .sparkle-grid {
      background-image:
        radial-gradient(circle at 16% 22%, rgba(255,255,255,0.22) 0 2px, transparent 3px),
        radial-gradient(circle at 82% 18%, rgba(255,255,255,0.16) 0 2px, transparent 3px),
        radial-gradient(circle at 65% 78%, rgba(255,255,255,0.18) 0 2px, transparent 3px);
      background-size: 160px 160px, 210px 210px, 190px 190px;
    }

    .rosco-wrap {
      position: relative;
      width: min(90vw, 720px);
      aspect-ratio: 1 / 1;
      margin: auto;
    }

    .letter-bubble {
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: white;
      border: 3px solid rgba(255,255,255,0.9);
      box-shadow: 0 10px 18px rgba(0,0,0,0.18), inset 0 2px 0 rgba(255,255,255,0.35);
      transform: translate(-50%, -50%);
      transition: 0.25s ease;
      background: #2563eb;
    }

    .letter-bubble.current {
      transform: translate(-50%, -50%) scale(1.22);
      box-shadow: 0 0 0 7px rgba(255,255,255,0.28), 0 18px 28px rgba(0,0,0,0.24);
      background: #facc15;
      color: #0f172a;
    }

    .letter-bubble.correct {
      background: #16a34a;
    }

    .letter-bubble.wrong {
      background: #dc2626;
    }

    .center-orb {
      position: absolute;
      inset: 20%;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.3);
      box-shadow: inset 0 0 35px rgba(255,255,255,0.15), 0 22px 50px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px;
    }

    .game-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .question-box {
      width: 100%;
      background: rgba(255,255,255,0.92);
      color: #0f172a;
      border-radius: 28px;
      padding: 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.2);
    }

    .question-box h2 {
      margin: 0 0 8px;
      font-size: 1rem;
      text-transform: uppercase;
      color: #2563eb;
    }

    .question-box p {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .answer-input {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
      outline: none;
    }

    .buttons {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: 0.2s ease;
      font-family: inherit;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #facc15;
      color: #172554;
    }

    .light {
      background: white;
      color: #172554;
    }

    .stats {
      display: flex;
      gap: 14px;
      font-weight: 900;
      font-size: 0.95rem;
    }

    .timer {
      font-size: 3rem;
      font-weight: 900;
    }

    .message {
      min-height: 24px;
      font-weight: 800;
    }

    @media (max-width: 768px) {
      .letter-bubble {
        width: 40px;
        height: 40px;
        font-size: 0.9rem;
      }

      .center-orb {
        inset: 24%;
        padding: 18px;
      }

      .question-box p {
        font-size: 0.95rem;
      }
    }
  </style>
 </head>
 <body>
  <div class="app-shell sparkle-grid">
   <main class="w-full min-h-screen flex items-center justify-center p-4">
    <section class="rosco-wrap" id="rosco">
      <div id="lettersRing"></div>

      <div class="center-orb">
        <div class="game-panel">
          <div>
            <div class="timer" id="timer">180</div>
            <div class="font-black uppercase text-sm tracking-widest">segundos</div>
          </div>

          <div class="stats">
            <div><span id="correctCount">0</span> ✅</div>
            <div><span id="wrongCount">0</span> ❌</div>
            <div><span id="pendingCount">27</span> ⏳</div>
          </div>

          <div class="question-box">
            <h2 id="letterTitle">Pulsa empezar</h2>
            <p id="questionText">Cuando empiece el juego aparecerá aquí la definición.</p>
          </div>

          <input id="answerInput" class="answer-input" type="text" placeholder="Escribe tu respuesta..." disabled>

          <div class="buttons">
            <button class="primary" id="startBtn">Empezar</button>
            <button class="primary" id="checkBtn" disabled>Comprobar</button>
            <button class="secondary" id="passBtn" disabled>Pasapalabra</button>
            <button class="light" id="restartBtn">Reiniciar</button>
          </div>

          <div class="message" id="message"></div>
        </div>
      </div>
    </section>
   </main>
  </div>

  <script>
    const questions = [
      { letter: "A", clue: "Capa gaseosa que rodea la Tierra.", answer: "atmósfera" },
      { letter: "B", clue: "Conjunto de todos los seres vivos de la Tierra.", answer: "biosfera" },
      { letter: "C", clue: "Relación alimentaria que muestra quién se come a quién.", answer: "cadena trófica" },
      { letter: "D", clue: "Conjunto de todos los seres vivos del planeta.", answer: "diversidad" },
      { letter: "E", clue: "Conjunto formado por biotopo y biocenosis.", answer: "ecosistema" },
      { letter: "F", clue: "Proceso por el que las plantas fabrican su alimento usando luz.", answer: "fotosíntesis" },
      { letter: "G", clue: "Capa sólida de la Tierra.", answer: "geosfera" },
      { letter: "H", clue: "Conjunto de toda el agua del planeta.", answer: "hidrosfera" },
      { letter: "I", clue: "Relación entre especies diferentes.", answer: "interespecífica" },
      { letter: "J", clue: "Hábito saludable.", answer: "jugar" },
      { letter: "K", clue: "Unidad absoluta de temperatura.", answer: "kelvin" },
      { letter: "L", clue: "Energía necesaria para la fotosíntesis.", answer: "luz" },
      { letter: "M", clue: "Organismo descomponedor microscópico.", answer: "microorganismo" },
      { letter: "N", clue: "Posición en una cadena alimentaria.", answer: "nivel trófico" },
      { letter: "Ñ", clue: "Etapa de los ríos donde predomina la erosión.", answer: "montaña" },
      { letter: "O", clue: "Gas liberado en la fotosíntesis.", answer: "oxígeno" },
      { letter: "P", clue: "Conjunto de individuos de la misma especie.", answer: "población" },
      { letter: "Q", clue: "Proceso de liberar gases por combustión.", answer: "quemar" },
      { letter: "R", clue: "Conjunto de cadenas tróficas.", answer: "red trófica" },
      { letter: "S", clue: "Capa superficial donde crecen plantas.", answer: "suelo" },
      { letter: "T", clue: "Movimiento de las plantas.", answer: "tropismo" },
      { letter: "U", clue: "Organismo que fabrica su alimento.", answer: "autótrofo" },
      { letter: "V", clue: "Desarrollo embrionario dentro de la madre.", answer: "vivíparo" },
      { letter: "W", clue: "Unidad de potencia.", answer: "watio" },
      { letter: "X", clue: "Capa más externa de la atmósfera.", answer: "exosfera" },
      { letter: "Y", clue: "En el mutualismo ambos organismos se...", answer: "ayudan" },
      { letter: "Z", clue: "Gas que protege de radiación UV.", answer: "ozono" }
    ];

    const GAME_TIME = 180;
    let currentIndex = 0;
    let timeLeft = GAME_TIME;
    let started = false;
    let timerInterval;

    const state = questions.map(() => 'pending');

    const lettersRing = document.getElementById('lettersRing');
    const timer = document.getElementById('timer');
    const letterTitle = document.getElementById('letterTitle');
    const questionText = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const startBtn = document.getElementById('startBtn');
    const checkBtn = document.getElementById('checkBtn');
    const passBtn = document.getElementById('passBtn');
    const restartBtn = document.getElementById('restartBtn');
    const message = document.getElementById('message');

    function normalize(text) {
      return text.toLowerCase().trim().normalize('NFD').replace(/[̀-ͯ]/g, '');
    }

    function createRosco() {
      const radius = 44;

      questions.forEach((q, i) => {
        const angle = (i / questions.length) * Math.PI * 2 - Math.PI / 2;
        const x = 50 + radius * Math.cos(angle);
        const y = 50 + radius * Math.sin(angle);

        const bubble = document.createElement('div');
        bubble.className = 'letter-bubble';
        bubble.id = `letter-${i}`;
        bubble.style.left = `${x}%`;
        bubble.style.top = `${y}%`;
        bubble.textContent = q.letter;

        lettersRing.appendChild(bubble);
      });
    }

    function updateRosco() {
      questions.forEach((_, i) => {
        const el = document.getElementById(`letter-${i}`);
        el.className = 'letter-bubble';

        if (state[i] !== 'pending') {
          el.classList.add(state[i]);
        }

        if (started && i === currentIndex && state[i] === 'pending') {
          el.classList.add('current');
        }
      });
    }

    function updateStats() {
      document.getElementById('correctCount').textContent = state.filter(s => s === 'correct').length;
      document.getElementById('wrongCount').textContent = state.filter(s => s === 'wrong').length;
      document.getElementById('pendingCount').textContent = state.filter(s => s === 'pending').length;
    }

    function showQuestion() {
      while (state[currentIndex] !== 'pending') {
        currentIndex = (currentIndex + 1) % questions.length;

        if (!state.includes('pending')) {
          endGame();
          return;
        }
      }

      const q = questions[currentIndex];

      letterTitle.textContent = `Empieza por ${q.letter}`;
      questionText.textContent = q.clue;
      answerInput.value = '';
      answerInput.focus();

      updateRosco();
      updateStats();
    }

    function nextQuestion() {
      currentIndex = (currentIndex + 1) % questions.length;
      showQuestion();
    }

    function checkAnswer() {
      const user = normalize(answerInput.value);
      const correct = normalize(questions[currentIndex].answer);

      if (!user) {
        message.textContent = 'Escribe una respuesta.';
        return;
      }

      if (user === correct) {
        state[currentIndex] = 'correct';
        message.textContent = '✅ ¡Correcto!';
      } else {
        state[currentIndex] = 'wrong';
        message.textContent = `❌ ${questions[currentIndex].answer}`;
      }

      updateRosco();
      updateStats();

      setTimeout(nextQuestion, 700);
    }

    function passQuestion() {
      message.textContent = '⏭️ Pasapalabra';
      nextQuestion();
    }

    function startGame() {
      if (started) return;

      started = true;
      startBtn.disabled = true;
      checkBtn.disabled = false;
      passBtn.disabled = false;
      answerInput.disabled = false;

      showQuestion();

      timerInterval = setInterval(() => {
        timeLeft--;
        timer.textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      clearInterval(timerInterval);
      started = false;
      answerInput.disabled = true;
      checkBtn.disabled = true;
      passBtn.disabled = true;

      message.textContent = '🏆 Juego terminado';
    }

    function restartGame() {
      clearInterval(timerInterval);

      currentIndex = 0;
      timeLeft = GAME_TIME;
      started = false;

      state.fill('pending');

      timer.textContent = GAME_TIME;
      answerInput.disabled = true;
      startBtn.disabled = false;
      checkBtn.disabled = true;
      passBtn.disabled = true;

      message.textContent = '';
      letterTitle.textContent = 'Pulsa empezar';
      questionText.textContent = 'Cuando empiece el juego aparecerá aquí la definición.';

      updateRosco();
      updateStats();
    }

    startBtn.addEventListener('click', startGame);
    checkBtn.addEventListener('click', checkAnswer);
    passBtn.addEventListener('click', passQuestion);
    restartBtn.addEventListener('click', restartGame);

    answerInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && started) {
        checkAnswer();
      }
    });

    createRosco();
    updateRosco();
    updateStats();
  </script>
 </body>
</html>
